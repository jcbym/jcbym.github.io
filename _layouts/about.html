<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inconsolata">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body class="page">
    <div class="container">
      {% include navigation.html %}
      <div class="content">
        <div class="profile">
          <img src="/assets/images/profile.jpg" alt="Profile picture">
          <div class="description">
            <div class="name">
              <h1>Jacob Yim</h1>
              <span>(he/they)</span>
            </div>
            <div class="links">
              <p class="email"><img src="/assets/svg/email.svg" alt="Email">j1yim (at) ucsd.edu</p>
              <p><img src="/assets/svg/cv.svg" alt="CV"><a href="/assets/files/jacob-yim-cv.pdf" target="_blank">CV</a></p>
            </div>
          </div>
        </div>
        {{ content }}
      </div>
    </div>
  </body>
</html>
